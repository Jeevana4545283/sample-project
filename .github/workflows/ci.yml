
name: CI Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          echo "All required files exist"

      - name: Build project
        run: |
          echo "Static HTML, CSS and JavaScript project"
          echo "Build successful"

      - name: Test HTML
        run: |
          grep -qi "<html" index.html
          grep -qi "<h1" index.html
          echo "HTML test passed"

      - name: Test CSS
        run: |
          grep -q "body" style.css
          echo "CSS test passed"

      - name: Test JavaScript
        run: |
          grep -Eq "addEventListener|showMessage" script.js
          echo "JavaScript test passed"

      - name: All tests completed
        run: echo "All checks passed successfully"
