
name: CI Workflow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          echo "All files exist"

      - name: Build project
        run: echo "Build successful"

      - name: Test project
        run: |
          grep -q "Welcome to My Project!" index.html
          echo "All tests passed"
